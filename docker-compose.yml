# `make docker-up` writes a .env with a generated token and starts this.
# `docker compose up -d` works too, once MAGPIE_TOKEN is set in .env.
services:
  magpie:
    # A published release. To build from this checkout instead:
    #   docker compose build && docker compose up -d
    image: ghcr.io/raden-m/magpie:${MAGPIE_VERSION:-latest}
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      # Inside a container there is no loopback worth binding to, so Magpie is
      # reachable from the Docker network and a token is not optional. The
      # published port below is still limited to this machine.
      MAGPIE_BIND: 0.0.0.0:8787
      MAGPIE_DATA_DIR: /data
      MAGPIE_TOKEN: ${MAGPIE_TOKEN:?set MAGPIE_TOKEN in .env, or run `make docker-up` to generate one}
      # The URL this is reached at when a reverse proxy fronts it, e.g.
      # https://magpie.example.com. Its hostname is allowed automatically, and
      # it is what `make connect` prints for the extension to pair with.
      MAGPIE_PUBLIC_URL: ${MAGPIE_PUBLIC_URL:-}
      # Further hostnames to answer to, beyond that one. Addresses always work.
      MAGPIE_ALLOWED_HOSTS: ${MAGPIE_ALLOWED_HOSTS:-}
      # Extension origins allowed via CORS, e.g. chrome-extension://<id>. Not
      # needed when the extension holds a host permission for this backend.
      MAGPIE_ALLOWED_ORIGINS: ${MAGPIE_ALLOWED_ORIGINS:-}
      MAGPIE_LOG: ${MAGPIE_LOG:-info}
    volumes:
      # SQLite runs in WAL mode, whose locking is unreliable on NFS and SMB.
      # This must be local storage - back up *from* it, don't run *on* a NAS.
      - ./data:/data
    # Published to this machine only. Put it behind a reverse proxy that
    # terminates TLS before letting anything else reach it.
    ports:
      - "127.0.0.1:8787:8787"
