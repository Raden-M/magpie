<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Magpie - Options</title>
    <style>
      :root { color-scheme: light dark; }
      /* The wordmark face, shared with the app. Bundled beside this page; block
         swap keeps the six-glyph file from flashing in a fallback shape. */
      @font-face {
        font-family: "Magpie Wordmark";
        src: url(magpie-wordmark.woff2) format("woff2");
        font-weight: 600;
        font-display: block;
      }
      body {
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #0c0d11; color: #ecedf1; margin: 0; padding: 2.5rem 1.5rem;
        display: flex; justify-content: center;
      }
      main { width: 100%; max-width: 30rem; }
      /* Wordmark size lives here so the mark can be sized off it, as in the app. */
      .brand { display: flex; align-items: center; gap: 0.6rem; margin-bottom: 0.25rem; font-size: 1.5rem; }
      .brand img { height: 1.8em; width: auto; flex: none; }
      h1 {
        font-family: "Magpie Wordmark", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        font-weight: 600; letter-spacing: -0.02em; font-size: 1em; margin: 0;
      }
      .brand-pie {
        background: linear-gradient(101deg, #7ad0ff, #52a0ff, #4f7cf7);
        -webkit-background-clip: text; background-clip: text; color: transparent;
        border-bottom: 2px solid transparent;
        border-image: linear-gradient(101deg, #7ad0ff, #52a0ff, #4f7cf7) 1; padding-bottom: 1px;
      }
      p.lede { color: #b9bbc4; margin: 0 0 2rem; font-size: 0.9rem; }
      label { display: block; margin: 1.25rem 0 0.4rem; font-size: 0.8rem; font-weight: 600; color: #b9bbc4; }
      input, select {
        width: 100%; box-sizing: border-box; font-size: 0.95rem; font-family: inherit;
        padding: 0.55rem 0.75rem; color: #ecedf1; background: #14161c;
        border: 1px solid #24262e; border-radius: 8px; outline: none;
      }
      input:focus, select:focus { border-color: transparent; border-image: linear-gradient(101deg, #7ad0ff, #52a0ff, #4f7cf7) 1; }
      .hint { color: #7e828f; font-size: 0.75rem; margin-top: 0.35rem; }
      .row { display: flex; gap: 0.75rem; align-items: center; margin-top: 1.75rem; }
      button {
        font-size: 0.9rem; font-weight: 600; border: none; border-radius: 8px; padding: 0.6rem 1.1rem; cursor: pointer;
      }
      button.primary { color: #0c0d11; background: linear-gradient(101deg, #7ad0ff, #52a0ff, #4f7cf7); }
      button.ghost { color: #b9bbc4; background: transparent; border: 1px solid #24262e; }
      button.ghost:hover { color: #ecedf1; }
      .status { margin-left: auto; font-size: 0.82rem; color: #7e828f; }
      .status.ok { color: #2cd8d0; }
      .status.error { color: #ff6b6b; }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">
        <img src="icons/magpie.svg" alt="" />
        <h1>Mag<span class="brand-pie">pie</span></h1>
      </div>
      <p class="lede">Point the extension at your self-hosted Magpie backend.</p>

      <label for="backendUrl">Backend URL</label>
      <input id="backendUrl" type="url" placeholder="http://127.0.0.1:8787" spellcheck="false" />
      <div class="hint">Where your Magpie server is reachable.</div>

      <label for="token">Token</label>
      <input id="token" type="password" placeholder="(none for a local, loopback backend)" spellcheck="false" />
      <div class="hint">Required for a remote backend. Stored locally, never synced.</div>

      <label for="defaultShade">Default shade</label>
      <select id="defaultShade">
        <option value="iridescent">Iridescent</option>
        <option value="blue">Blue</option>
        <option value="teal">Teal</option>
        <option value="purple">Purple</option>
      </select>

      <div class="row">
        <button id="save" class="primary" type="button">Save</button>
        <button id="test" class="ghost" type="button">Test connection</button>
        <span id="status" class="status"></span>
      </div>
    </main>
    <script src="options.js"></script>
  </body>
</html>
